name: Actualitzar pressupost AOC

on:
  schedule:
    # Cada dilluns a les 06:30 UTC (mig minut després dels contractes)
    - cron: '30 6 * * 1'
  workflow_dispatch:

jobs:
  fetch-pressupost:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: pip install requests

      - name: Executar script
        run: python fetch_pressupost.py

      - name: Commit i push si hi ha canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/pressupost.json json/execucio.json
          git diff --staged --quiet || git commit -m "auto: actualització pressupost $(date +'%Y-%m-%d')"
          git push
