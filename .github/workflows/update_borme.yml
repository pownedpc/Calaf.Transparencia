name: Actualitzar BORME Calaf

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  fetch-borme:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: python -m pip install duckdb

      - name: Descarregar i creuar BORME
        run: python fetch_borme_bquant.py

      - name: Commit i push si hi ha canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/borme_adjudicataris.json
          git diff --staged --quiet || git commit -m "auto: actualitzacio BORME Calaf $(date +'%Y-%m-%d')"
          git push
